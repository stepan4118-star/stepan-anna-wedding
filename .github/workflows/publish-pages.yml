name: Publish wedding site with preview

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout live site
        uses: actions/checkout@v4
        with:
          ref: main
          path: live

      - name: Checkout preview site
        uses: actions/checkout@v4
        with:
          ref: preview
          path: preview-src

      - name: Assemble live and preview versions
        run: |
          mkdir -p public/preview
          rsync -a --exclude='.git' --exclude='.github' live/ public/
          rsync -a --exclude='.git' --exclude='.github' preview-src/ public/preview/
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
